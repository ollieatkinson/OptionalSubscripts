name: Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v2
    - name: Toolchain
      run: swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --parallel

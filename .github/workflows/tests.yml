name: Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v2
    - name: Toolchain
      run: swift --version
    - name: Check typed concurrency foundations
      run: swiftc -swift-version 6 -strict-concurrency=complete -warnings-as-errors -typecheck Sources/OptionalSubscripts/ValuePond.swift Sources/OptionalSubscripts/Lake.swift
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --parallel

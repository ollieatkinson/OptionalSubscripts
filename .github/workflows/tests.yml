name: Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v2
    - name: Toolchain
      run: |
        xcodebuild -version
        swift --version
        swift --version | grep -F 'Swift version 6.4'
    - name: Check typed concurrency foundations
      run: swiftc -swift-version 6 -strict-concurrency=complete -warnings-as-errors -typecheck Sources/OptionalSubscripts/Pond.swift Sources/OptionalSubscripts/Lake.swift Sources/OptionalSubscripts/Trie.swift
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --parallel

name: Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v2
    - name: Toolchain
      run: |
        xcodebuild -version
        swift --version
        swift --version | grep -F 'Swift version 6.4'
    - name: Build all public sources with strict concurrency
      run: swift build -v -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
    - name: Run all tests with strict concurrency
      run: swift test -v --parallel -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
    - name: Compare Tree and Trie in release mode
      env:
        TREE_BENCHMARK: "1"
      run: swift test -c release --filter TreeBenchmarks
